name: Renovate

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.repository }}-renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_SECRETS: >-
            {"NIX_PRIVATE_PAT":"${{ secrets.NIX_PRIVATE_PAT }}"}
          RENOVATE_CUSTOM_ENV_VARIABLES: >-
            {"NIX_PRIVATE_PAT":"{{ secrets.NIX_PRIVATE_PAT }}","GIT_CONFIG_COUNT":"3","GIT_CONFIG_KEY_0":"url.https://github.com/benbouillet/nix-private.git.insteadOf","GIT_CONFIG_VALUE_0":"ssh://git@github.com/benbouillet/nix-private.git","GIT_CONFIG_KEY_1":"credential.https://github.com/benbouillet/nix-private.git.helper","GIT_CONFIG_VALUE_1":"!f() { case \"$1\" in get) printf \"%s\\n\" \"username=x-access-token\" \"password=$NIX_PRIVATE_PAT\" ;; esac; }; f","GIT_CONFIG_KEY_2":"credential.https://github.com/benbouillet/nix-private.git.useHttpPath","GIT_CONFIG_VALUE_2":"true"}
