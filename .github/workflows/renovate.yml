name: Renovate

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.repository }}-renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_SECRETS: >-
            {"NIX_PRIVATE_PAT":"${{ secrets.NIX_PRIVATE_PAT }}"}
          RENOVATE_HOST_RULES: >-
            [{"matchHost":"https://github.com/benbouillet/nix-private.git/","hostType":"git-refs","token":"{{ secrets.NIX_PRIVATE_PAT }}"}]
          RENOVATE_CUSTOM_ENV_VARIABLES: >-
            {"GIT_CONFIG_COUNT":"1","GIT_CONFIG_KEY_0":"url.https://x-access-token:{{ secrets.NIX_PRIVATE_PAT }}@github.com/benbouillet/nix-private.git.insteadOf","GIT_CONFIG_VALUE_0":"ssh://git@github.com/benbouillet/nix-private.git"}
